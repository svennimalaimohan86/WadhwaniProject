    <circle cx="102" cy="75" r="5" fill="#FFBD2E"/>
    <circle cx="119" cy="75" r="5" fill="#27C93F"/>
    
    <rect x="420" y="65" width="360" height="20" rx="5" fill="#FFFFFF" stroke="#EEEEF5"/>
