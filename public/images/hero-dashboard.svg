    <text x="360" y="200" font-family="'Poppins', sans-serif" font-size="28" font-weight="700" fill="#20213A">6 Courses</text>
    <text x="360" y="224" font-family="'Inter', sans-serif" font-size="11" fill="#635BDB">18 lecture hrs/wk</text>

    <rect x="590" y="130" width="220" height="110" rx="12" fill="#FFFFFF" stroke="#EEEEF5"/>
    <text x="610" y="160" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#5F6388">Attendance Avg</text>
    <text x="610" y="200" font-family="'Poppins', sans-serif" font-size="28" font-weight="700" fill="#20213A">94.6%</text>
    <text x="610" y="224" font-family="'Inter', sans-serif" font-size="11" fill="#10B981">Verified attendance</text>

    <rect x="840" y="130" width="220" height="110" rx="12" fill="#FFFFFF" stroke="#EEEEF5"/>
    <text x="860" y="160" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#5F6388">Performance</text>
    <text x="860" y="200" font-family="'Poppins', sans-serif" font-size="28" font-weight="700" fill="#635BDB">3.84 GPA</text>
    <text x="860" y="224" font-family="'Inter', sans-serif" font-size="11" fill="#5F6388">Top 5% Faculty Tier</text>

