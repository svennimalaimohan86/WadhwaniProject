<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8F9FE"/>
      <stop offset="100%" stop-color="#ECEBFC"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7B73F5"/>
      <stop offset="100%" stop-color="#635BDB"/>
    </linearGradient>
    <filter id="cardShadow" x="-10" y="-10" width="1220" height="820" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#20213A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Main Dashboard Canvas -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="50" width="1080" height="700" rx="16" fill="#FFFFFF" stroke="#EEEEF5" stroke-width="1.5"/>
    
    <!-- Topbar -->
    <path d="M60 66C60 57.1634 67.1634 50 76 50H1124C1132.84 50 1140 57.1634 1140 66V100H60V66Z" fill="#FAFAFC" stroke="#EEEEF5"/>
