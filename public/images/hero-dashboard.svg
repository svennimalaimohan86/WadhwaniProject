    <text x="135" y="560" font-family="'Inter', sans-serif" font-size="12" fill="#5F6388">02:00 - 03:00 PM • Faculty Boardroom</text>
    <rect x="535" y="530" width="90" height="24" rx="12" fill="#F3F4F6"/>
    <text x="545" y="546" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#4B5563">SCHEDULED</text>

    <!-- Right Side Analytics Panel -->
    <rect x="700" y="270" width="360" height="440" rx="14" fill="#FFFFFF" stroke="#EEEEF5"/>
    <text x="725" y="305" font-family="'Poppins', sans-serif" font-size="16" font-weight="700" fill="#20213A">Recent Faculty Activity</text>

    <rect x="725" y="330" width="310" height="60" rx="8" fill="#FAFAFC" stroke="#EEEEF5"/>
    <text x="740" y="355" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#20213A">Assignment 4 Graded</text>
