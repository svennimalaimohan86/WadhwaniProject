    <text x="575" y="366" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#059669">LIVE</text>

    <rect x="115" y="420" width="530" height="70" rx="8" fill="#FFFFFF" stroke="#EEEEF5"/>
    <text x="135" y="450" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#20213A">CS-204: Data Structures Lab</text>
    <text x="135" y="470" font-family="'Inter', sans-serif" font-size="12" fill="#5F6388">11:15 - 12:45 PM • Lab Suite 302 • 48 Students</text>
    <rect x="540" y="440" width="85" height="24" rx="12" fill="#EFF6FF"/>
    <text x="552" y="456" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#2563EB">UPCOMING</text>

