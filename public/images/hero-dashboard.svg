    <rect x="725" y="405" width="310" height="60" rx="8" fill="#FAFAFC" stroke="#EEEEF5"/>
    <text x="740" y="430" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#20213A">Attendance Verified CS-301</text>
    <text x="740" y="450" font-family="'Inter', sans-serif" font-size="11" fill="#5F6388">68/72 turnout • 94.4%</text>

    <rect x="725" y="480" width="310" height="100" rx="8" fill="#F3F1FF" stroke="#E2DCFE"/>
    <text x="740" y="505" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#635BDB">SIS Synchronization</text>
    <text x="740" y="525" font-family="'Inter', sans-serif" font-size="11" fill="#5F6388">All student grades and records</text>
    <text x="740" y="542" font-family="'Inter', sans-serif" font-size="11" fill="#5F6388">synced with Registrar portal.</text>
    <text x="740" y="565" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#10B981">✓ Verified Synchronized</text>
